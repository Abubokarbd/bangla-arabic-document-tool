
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="A simple document editor for Bengali, English and Arabic text with A4 page preview and export options.">

  <title>Bangla Arabic Document Tool</title>

  <!-- Main styles -->
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/editor.css">
  <link rel="stylesheet" href="assets/css/preview.css">
</head>

<body>
  <header class="app-header">
    <h1>Bangla Arabic Document Tool</h1>
    <p>Write, format and prepare your document.</p>
  </header>

  <main class="app-container">

    <!-- Text editor -->
    <section id="editor-section" class="panel">
      <h2>Document Editor</h2>

      <label for="document-text">Enter your text</label>

      <textarea
        id="document-text"
        placeholder="Type or paste Bengali, English and Arabic text here..."
        spellcheck="false"
      ></textarea>
    </section>

    <!-- Font settings -->
    <section id="font-settings-section" class="panel">
      <h2>Font Settings</h2>
      <p>Font controls will be added here.</p>
    </section>

    <!-- Page settings -->
    <section id="page-settings-section" class="panel">
      <h2>Page Settings</h2>
      <p>A4 size, orientation and margins will be added here.</p>
    </section>

    <!-- Preview and export -->
    <section id="document-actions-section" class="panel">
      <h2>Preview and Download</h2>

      <button id="preview-button" type="button">
        Preview Document
      </button>
    </section>

  </main>

  <!-- Preview window -->
  <div id="preview-modal" class="modal" hidden>
    <div class="modal-content">
      <button id="close-preview" type="button" aria-label="Close preview">
        &times;
      </button>

      <h2>Document Preview</h2>

      <div id="preview-content"></div>

      <div class="preview-controls">
        <button id="zoom-out" type="button">−</button>
        <button id="fit-preview" type="button">Fit</button>
        <button id="zoom-in" type="button">+</button>
      </div>

      <div class="export-controls">
        <button id="download-pdf" type="button">Download PDF</button>
        <button id="download-png" type="button">Download PNG</button>
      </div>
    </div>
  </div>

  <!-- JavaScript modules -->
  <script src="assets/js/language-detection.js" defer></script>
  <script src="assets/js/font-settings.js" defer></script>
  <script src="assets/js/page-layout.js" defer></script>
  <script src="assets/js/preview.js" defer></script>
  <script src="assets/js/pdf-export.js" defer></script>
  <script src="assets/js/png-export.js" defer></script>
  <script src="assets/js/app.js" defer></script>
</body>
</html>
